<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenGlossary · Live Demo</title>
<meta name="description" content="농림 전문용어를 쉬운 우리말로 바꿔주는 KoBERT 기반 순화 번역기 라이브 데모">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --text: #1a1d24; --text-sub: #5b6472;
    --border: #e4e7ec; --accent: #16a34a; --accent-dark: #15803d; --accent-soft: #ecfdf3;
    --online: #16a34a; --online-bg: #ecfdf3; --sleep: #d97706; --sleep-bg: #fffbeb;
    --hl: #dcfce7; --hl-border: #86efac;
    --shadow: 0 1px 2px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1117; --surface: #171b23; --text: #eef1f6; --text-sub: #9aa4b2;
      --border: #262c37; --accent: #4ade80; --accent-dark: #86efac; --accent-soft: #12271a;
      --online: #4ade80; --online-bg: #12271a; --sleep: #fbbf24; --sleep-bg: #2b2210;
      --hl: #14532d; --hl-border: #166534;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.7; -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 24px 80px; }

  header { padding: 44px 0 28px; }
  .back { display: inline-flex; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--text-sub); text-decoration: none; margin-bottom: 18px; }
  .back:hover { color: var(--accent); }
  h1 { font-size: clamp(24px, 4vw, 34px); font-weight: 800; letter-spacing: -.02em; }
  .tagline { margin-top: 8px; font-size: 15.5px; color: var(--text-sub); max-width: 660px; }
  .meta-links { margin-top: 12px; font-size: 13.5px; }
  .meta-links a { color: var(--accent-dark); text-decoration: none; font-weight: 600; }
  #server-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    color: var(--sleep); background: var(--sleep-bg); vertical-align: 2px; margin-left: 10px;
  }
  #server-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  #server-badge.online { color: var(--online); background: var(--online-bg); }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  .panel h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-sub); margin-bottom: 12px; }

  textarea {
    width: 100%; min-height: 110px; resize: vertical;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font: inherit; font-size: 14.5px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .sample-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .sample-row .label { font-size: 12.5px; color: var(--text-sub); align-self: center; }
  .chipbtn {
    font-size: 12.5px; font-weight: 600; padding: 7px 13px;
    border: 1px solid var(--border); border-radius: 999px; background: transparent;
    color: var(--text); cursor: pointer; font-family: inherit;
  }
  .chipbtn:hover { border-color: var(--accent); color: var(--accent-dark); }
  #run {
    margin-top: 14px; padding: 12px 34px;
    font-size: 15px; font-weight: 700; font-family: inherit;
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    cursor: pointer; transition: filter .15s;
  }
  #run:hover:not(:disabled) { filter: brightness(1.08); }
  #run:disabled { opacity: .55; cursor: default; }
  #status { display: inline-block; margin-left: 14px; font-size: 13px; color: var(--text-sub); }
  #status.error { color: #dc2626; }

  #results { display: none; margin-top: 22px; }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .compare-grid { grid-template-columns: 1fr; } }
  .text-box { font-size: 15px; }
  .text-box .original { color: var(--text-sub); }
  mark { background: var(--hl); border: 1px solid var(--hl-border); border-radius: 5px; padding: 0 4px; color: inherit; font-weight: 600; }

  #terms-panel { margin-top: 14px; }
  .term-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .term-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--bg); }
  .term-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .term-head .arrow { color: var(--text-sub); font-weight: 400; }
  .term-head .to { color: var(--accent-dark); }
  .term-desc { font-size: 13px; color: var(--text-sub); margin-top: 6px; }
  .homonym-badge {
    margin-left: auto; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    color: #7c3aed; background: #f3e8ff;
  }
  @media (prefers-color-scheme: dark) { .homonym-badge { color: #c4b5fd; background: #2e1f47; } }
  .no-terms { font-size: 14px; color: var(--text-sub); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../">← 전체 프로젝트</a>
    <h1>🌱 GreenGlossary <span id="server-badge">서버 확인 중</span></h1>
    <p class="tagline">"간벌", "복토", "몽리 면적" 같은 어려운 산림·농업 한자어를 <strong>쉬운 우리말로</strong> 바꿔줍니다. KoBERT가 동음이의어의 문맥을 판별하고, 치환 후 어긋난 조사까지 자동 교정하는 데모예요.</p>
    <div class="meta-links"><a href="https://github.com/Kim-jin-gwang/GreenGlossary" target="_blank" rel="noopener">GitHub 저장소</a></div>
  </header>

  <div class="panel">
    <h2>변환할 문장</h2>
    <textarea id="input" placeholder="임야의 사토에는 복토가 필요하며, 몽리 면적을 정확히 측정해야 한다."></textarea>
    <div class="sample-row">
      <span class="label">샘플 문장:</span>
      <button class="chipbtn" data-sample="임야의 사토에는 복토가 필요하며, 몽리 면적을 정확히 측정해야 한다.">전문용어 여러 개</button>
      <button class="chipbtn" data-sample="열식간벌을 실시한 뒤 연륜을 조사하여 우량종자 생산 임지를 선정한다.">조사 교정 확인</button>
      <button class="chipbtn" data-sample="병충해를 입은 소나무의 도장 여부를 확인하고 가지치기를 실시했다.">동음이의어 (나무의 도장)</button>
      <button class="chipbtn" data-sample="계약서에 도장을 찍고 임업 계약을 체결하였다.">동음이의어 (찍는 도장)</button>
    </div>
    <div>
      <button id="run">쉬운 우리말로 변환</button>
      <span id="status"></span>
    </div>
  </div>

  <div id="results">
    <div class="compare-grid">
      <div class="panel"><h2>원문</h2><div class="text-box original" id="out-original"></div></div>
      <div class="panel"><h2>순화된 문장</h2><div class="text-box" id="out-result"></div></div>
    </div>
    <div class="panel" id="terms-panel">
      <h2>바뀐 용어</h2>
      <div class="term-grid" id="term-grid"></div>
    </div>
  </div>
</div>

<script type="module">
const SPACE = new URLSearchParams(location.search).get("api") || "https://kimjgwang-ml-demos.hf.space";
const $ = (s) => document.querySelector(s);
const statusEl = $("#status");
const badge = $("#server-badge");

let ClientMod = null, clientPromise = null;
async function getClient() {
  if (!ClientMod) ClientMod = await import("https://cdn.jsdelivr.net/npm/@gradio/client/+esm");
  if (!clientPromise) clientPromise = ClientMod.Client.connect(SPACE);
  return clientPromise;
}

(async () => {
  try {
    await getClient();
    badge.textContent = "온라인";
    badge.classList.add("online");
  } catch (e) {
    badge.textContent = "깨우는 중";
    console.warn(e);
  }
})();

document.querySelectorAll("[data-sample]").forEach((b) => {
  b.addEventListener("click", () => { $("#input").value = b.dataset.sample; });
});

$("#run").addEventListener("click", async () => {
  const text = $("#input").value.trim();
  if (!text) { statusEl.textContent = "문장을 입력하거나 샘플을 선택해주세요."; return; }
  const run = $("#run");
  run.disabled = true;
  statusEl.classList.remove("error");
  statusEl.textContent = "변환 중… (서버가 잠들어 있었다면 깨우는 데 1~2분)";

  try {
    const client = await getClient();
    const res = await client.predict("/simplify", [text]);
    render(res.data[0]);
    badge.textContent = "온라인";
    badge.classList.add("online");
    statusEl.textContent = "완료!";
  } catch (e) {
    console.error(e);
    statusEl.classList.add("error");
    statusEl.textContent = "변환에 실패했어요. 잠시 후 다시 시도해주세요.";
    clientPromise = null;
  } finally {
    run.disabled = false;
  }
});

function render(r) {
  $("#results").style.display = "block";
  $("#out-original").textContent = r.original;

  // 순화어를 하이라이트 표시
  let html = escapeHtml(r.result);
  const seen = new Set();
  for (const t of r.terms || []) {
    for (const word of [t["순화어"], t["설명"]]) {
      if (!word || seen.has(word)) continue;
      seen.add(word);
      const esc = escapeHtml(word).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      html = html.replace(new RegExp(esc, "g"), `<mark>${escapeHtml(word)}</mark>`);
    }
  }
  $("#out-result").innerHTML = html;

  const grid = $("#term-grid");
  grid.innerHTML = "";
  if (!r.terms || !r.terms.length) {
    grid.innerHTML = `<div class="no-terms">치환된 전문용어가 없습니다. (동음이의어가 일반 단어로 판별되었거나, 사전에 없는 문장이에요)</div>`;
    return;
  }
  for (const t of r.terms) {
    grid.insertAdjacentHTML("beforeend", `
      <div class="term-card">
        <div class="term-head">
          <span>${escapeHtml(t["용어"])}</span><span class="arrow">→</span><span class="to">${escapeHtml(t["순화어"])}</span>
          ${t["동음이의어판별"] ? '<span class="homonym-badge">KoBERT 판별</span>' : ""}
        </div>
        <div class="term-desc">${escapeHtml(t["설명"])}</div>
      </div>`);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
